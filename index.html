<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Click Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            height: 100vh;
            overflow: hidden;
            /* Respect device safe areas (notch) */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #game-container canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            /* Canvas should receive pointer events for gameplay */
            pointer-events: auto;
            display: block;
        }
        h1 {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.2rem;
            text-shadow: 2px 4px 8px rgba(2,6,23,0.45);
            animation: fadeIn 0.9s ease-in;
            z-index: 12;
            letter-spacing: 0.5px;
            font-weight: 700;
            padding-top: 6px;
        }
        /* HUD centered below the title */
        #hud {
            position: absolute;
            top: 62px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 18px;
            background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
            padding: 12px 18px;
            border-radius: 16px;
            backdrop-filter: blur(8px) saturate(120%);
            box-shadow: 0 12px 30px rgba(2,6,23,0.35);
            animation: slideIn 0.45s ease-out;
            z-index: 12;
            pointer-events: auto;
            align-items: center;
            min-width: 320px;
            max-width: 80%;
            justify-content: center;
        }
        #hud .kpi {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #e6eef8;
            font-weight: 600;
            font-size: 0.95rem;
        }
        #hud .kpi i { color: #fff; opacity: 0.9; }
        #hud .value { color: #ffd86b; font-weight: 700; min-width: 28px; text-align: center; }
        /* subtle pulsing glow on score */
        #hud .kpi.score { box-shadow: 0 6px 20px rgba(255,216,107,0.06); padding: 6px 10px; border-radius: 10px; }
        /* Floating reset + CTA */
        #reset {
            position: absolute;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 22px;
            background: linear-gradient(90deg, #ff8a65 0%, #ffca63 100%);
            color: #06263b;
            border: none;
            border-radius: 999px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            box-shadow: 0 12px 30px rgba(6,38,59,0.18);
            z-index: 12;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
            font-weight: 600;
        }
        #reset:hover {
            transform: translateX(-50%) translateY(-2px);
            box-shadow: 0 18px 40px rgba(6,38,59,0.22);
        }
        /* Small bottom info (fixed center) */
        #info {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: 18px;
            background: rgba(255,255,255,0.04);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            z-index: 39;
            color: rgba(230,238,248,0.95);
            box-shadow: 0 8px 28px rgba(2,6,23,0.28);
            pointer-events: none;
        }
        /* HUD progress integrated under KPIs */
        #hud { flex-direction: column; padding: 14px 20px; }
        #hud .kpiRow { display: flex; gap: 18px; align-items: center; }
        #hudProgress { width: 100%; margin-top: 12px; }
        #progress { height: 8px; width: 100%; background: rgba(255,255,255,0.06); border-radius: 999px; overflow: hidden; }
        #progress > i { display: block; height: 100%; background: linear-gradient(90deg,#ffd86b,#ff8a65); width: 0%; box-shadow: 0 6px 18px rgba(255,140,90,0.08); }
        /* Play area rectangle */
        #play-area {
            position: absolute;
            top: 150px;
            left: 50%;
            transform: translateX(-50%);
            width: min(1100px, 92%);
            height: calc(100vh - 260px);
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(6,10,30,0.02));
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.04);
            box-shadow: 0 30px 60px rgba(4,10,35,0.25), inset 0 -10px 30px rgba(0,0,0,0.06);
            overflow: hidden;
            z-index: 8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 80px; /* space for controls when pinned */
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @media (max-width: 768px) {
            h1 { font-size: 2rem; top: 10px; }
            #hud { top: 60px; left: 10px; transform: none; width: calc(100% - 20px); }
            #reset { bottom: 10px; padding: 10px 20px; font-size: 0.9rem; }
        }

        /* Pin controls to viewport on short screens so they remain visible */
        @media (max-height: 720px) {
            #reset { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 40; }
            #info { position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%); z-index: 39; }
            #play-area { padding-bottom: 120px; height: calc(100vh - 260px); }
        }
        @media (max-height: 520px) {
            #reset { bottom: 12px; }
            #info { bottom: 56px; font-size: 0.82rem; }
            #play-area { padding-bottom: 140px; height: calc(100vh - 240px); }
        }
        @media (max-width: 480px) {
            #hud {
                top: 56px;
                left: 50%;
                transform: translateX(-50%);
                width: calc(100% - 30px);
                justify-content: space-between;
                padding: 10px 14px;
            }
            h1 {
                font-size: 1.5rem;
            }
            /* progress is inside HUD now */
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>Click Game</h1>
        <div id="hud">
            <div class="kpiRow">
                <div class="kpi score"><i class="fas fa-star"></i><div class="label">Score</div><div class="value" id="score">0</div></div>
                <div class="kpi"><i class="fas fa-clock"></i><div class="label">Time</div><div class="value" id="time">0</div></div>
                <div class="kpi"><i class="fas fa-mouse-pointer"></i><div class="label">Clicks</div><div class="value" id="clicks">0</div></div>
            </div>
            <div id="hudProgress"><div id="progress"><i id="progressBar"></i></div></div>
        </div>
        <div id="play-area">
            <!-- p5 canvas will be attached here -->
            <button id="reset" aria-label="Reset game">Reset</button>
        </div>
        <div id="info">Tap targets as they appear </div>
    </div>
    <script src="sketch.js"></script>
</body>
</html>
